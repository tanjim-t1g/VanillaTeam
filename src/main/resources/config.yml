settings:
  # Minimum and maximum character length for team names (letters, numbers, underscores)
  min-name-length: 2
  max-name-length: 16

  # Maximum number of players allowed in a single team
  max-members: 10

  # Invitation and alliance request timeout in seconds
  invite-expire-seconds: 60
  ally-request-expire-seconds: 60

  # Default friendly fire status for newly created teams (true = PvP on, false = PvP protected)
  default-team-pvp: true

  # Duration in seconds a friendly fire vote stays open before auto-resolving
  pvp-vote-timeout-seconds: 30

messages:
  prefix: "&8[&7Team&8] "
  ally-prefix: "&8[&7Ally&8] "
  chat-format: "&8[&7TC&8] &f<player>&8: &7<message>"
  ally-chat-format: "&8[&7AC&8] &8[&7<team>&8] &f<player>&8: &7<message>"

  player-only: "&7This command is for players only."
  no-permission: "&7You don't have permission to do that."
